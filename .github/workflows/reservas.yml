# Uma vez por dia, tira a atribuição de issue cuja reserva venceu (CONTRIBUTING.md,
# "Fluxo", passo 2). Só mexe em issue: não lê segredo, não roda código de PR.
name: Reservas de issue

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  liberar:
    name: Liberar reservas vencidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Liberar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/reservas.mjs
