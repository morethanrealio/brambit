# Once a day, unassigns issues whose reservation expired (CONTRIBUTING.md,
# "Workflow", step 2). Only touches issues: reads no secret, runs no PR code.
name: Issue reservations

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  liberar:
    name: Free expired reservations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Free
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/reservas.mjs
