<!doctype html>
<html lang="__IDIOMA__">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title data-i18n="app_return_page.page_title">Signed in with Google</title>
<style nonce="__CSP_NONCE__">
  :root{--bg:#f4eee4;--card:#fffdf8;--line:#e5ddcd;--accent:#c97a52;--accent2:#dd9568;--txt:#2b2723;--mut:#736c5f;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:48px 20px;}
  .brandlogo{height:28px;width:auto;display:block;margin:0 0 28px;}
  h1{font-size:24px;line-height:1.25;margin:0 0 20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px;}
  .card p{margin:0 0 14px;color:var(--mut);font-size:15px;}
  .btn{display:block;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;text-decoration:none;text-align:center;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{border:1px solid var(--line);color:var(--txt);background:transparent;}
  .acct{word-break:break-all;color:var(--txt);}
</style>
</head>
<body>
<div class="wrap">
  <img class="brandlogo" src="/__LOGO__" alt="__MARCA__" translate="no"/>
  <h1 data-i18n="app_return_page.title">You're signed in</h1>
  <div class="card">
    <p data-i18n="app_return_page.login_lead">Signing in to the app? Go back to it.</p>
    <a class="btn primary" href="__APPLINK__" data-i18n="app_return_page.back_to_app">Back to the app</a>
  </div>
  <div class="card">
    <p data-i18n="app_return_page.connect_lead">The app can't finish connecting Google (Gmail, Calendar, Drive) yet. Here it connects to <b class="acct">__ACCOUNT__</b>.</p>
    <a class="btn ghost" href="__CONNECTLINK__" data-i18n="app_return_page.continue_connect">Connecting Google? Continue here</a>
  </div>
</div>
</body>
</html>
