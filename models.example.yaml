# ─────────────────────────────────────────────────────────────────────────────
# Brambit models: which provider and which model each task uses.
#
# How to use:
#   1. cp models.example.yaml models.yaml
#   2. in "providers", keep only the ones you will use and paste the keys into .env
#   3. in "tasks", choose the model for each task (at least "default")
#   4. npm run models       → shows the task → model table and warns about a missing key
#
# Without models.yaml, the built-in routing applies.
# With it, this file takes over: whatever is here applies to every task.
# A typo here makes the server refuse to start and it reports the line of the problem.
# ─────────────────────────────────────────────────────────────────────────────

# ── Providers ────────────────────────────────────────────────────────────────
# A provider is just data: your own alias, the API's base URL and the NAME of the
# .env variable that holds the key (never the key itself: this file can go into git).
#
# Any service that speaks the OpenAI protocol (/chat/completions) plugs in
# this way, with no code: Together, OpenAI, OpenRouter, DeepSeek, Groq, Fireworks,
# DeepInfra, Mistral, local vLLM and Ollama, etc. In "base_url", put the base URL
# (the server appends /chat/completions).
# Gemini has its own protocol: use "type: gemini" and no base_url is needed.
providers:
  together:
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
  gemini:
    type: gemini
    api_key_env: GEMINI_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  # openrouter:
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  # Model running on your own machine (no key: just don't add the "api_key_env" line).
  # ollama:
  #   base_url: http://localhost:11434/v1

# ── Tasks ────────────────────────────────────────────────────────────────────
# Each line picks the model for a task, in the format provider/model (the
# model is the exact id the provider uses in its API).
#
# A task with no line inherits from another, so you can start with just "default":
#   default ........... everything that has no line of its own
#   chat .............. the assistant talking to the user; needs to know how to
#                       call tools (calendar, email, search...)        ← default
#   image ............. turn where the user sent a photo; needs to see
#                       the image                                     ← chat
#   image_reading ..... describe or read the text of a stored image    ← image
#   research .......... reading sub-agents: web, Google, connectors    ← default
#   coding ............ writing code, building an app, spreadsheets    ← default
#   memory ............ keeping the profile and conversation summary   ← default
#   classification .... short labeling tasks: topics, moderation,
#                       app risk, routine offers                       ← default
#
# "fallback" (optional): model that kicks in if the primary one goes down (outage,
# provider error). Can be from another provider; it's how you avoid being left without a reply.
#
# "options" (optional): extra fields sent as-is in the call's body,
# for adjustments specific to each provider (e.g. reasoning_effort, temperature).
# On Gemini, the only option read is thinkingBudget.
tasks:
  default:
    model: together/deepseek-ai/DeepSeek-V4.1-Flash
    options:
      reasoning_effort: high
    fallback: gemini/gemini-3.7-flash

  # Examples (uncomment to use):
  # coding:
  #   model: openai/gpt-5.4-mini
  #   fallback: together/deepseek-ai/DeepSeek-V4.1-Flash
  # classification: together/deepseek-ai/DeepSeek-V4.1-Flash   ← short form, no fallback
  # memory:
  #   model: gemini/gemini-3.7-flash
  #   options:
  #     thinkingBudget: 0

# ── Prices (optional) ─────────────────────────────────────────────────────────
# The cost of each call is calculated from the model's price. The models above
# already have a registered price. For a new model, add a line here; without it,
# the server uses the fallback table (US$ 1.50 input / 9.00 output), which
# tends to be pricier than the real cost. Values in US$ per 1 million tokens:
#   input = text sent to the model; cached_input = input the provider reused
#   (cheaper); output = text that comes back (includes the "reasoning").
prices:
  # new-model-id:             ← the same id used in "tasks", without the provider
  #   input: 0.50              ← illustrative values: check the provider's pricing page
  #   cached_input: 0.05
  #   output: 2.00
