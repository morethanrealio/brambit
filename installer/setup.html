<!doctype html>
<html lang="pt-BR" data-mode="__MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brambit</title>
<style nonce="__CSP_NONCE__">
  :root { color-scheme: light dark; --border: #8884; --accent: #2f6fed; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; display: flex; justify-content: center; }
  main { width: 100%; max-width: 520px; padding: 32px 20px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 8px; }
  p.sub, small { opacity: .75; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=email], input[type=password], input[type=url], select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: transparent; color: inherit; }
  .ais { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ais label { font-weight: 400; margin: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .ais label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
  button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { margin-top: 8px; background: transparent; color: inherit; border: 1px solid var(--border); }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #d33; margin-top: 12px; }
  .status { margin-top: 16px; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  .steps { margin: 12px 0 0; padding: 10px 12px 10px 32px; border: 1px solid var(--border); border-radius: 8px; font-size: .9em; }
  .steps li + li { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
  <p class="error" id="no-code" hidden data-t="no_code"></p>
  <form id="form" novalidate>
    <div id="account">
    <h2 data-t="you"></h2>
    <label for="name" data-t="name"></label>
    <input id="name" type="text" autocomplete="name" required>
    <label for="email" data-t="email"></label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password" data-t="password"></label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <small data-t="password_hint"></small>
    <label for="password2" data-t="password2"></label>
    <input id="password2" type="password" autocomplete="new-password" required>
    </div>

    <h2 id="ai-title" data-t="ai"></h2>
    <small data-t="ai_hint"></small>
    <div class="ais">
      <label><input type="radio" name="provider" value="together" checked> Together</label>
      <label><input type="radio" name="provider" value="openai"> OpenAI</label>
      <label><input type="radio" name="provider" value="gemini"> Google Gemini</label>
      <label><input type="radio" name="provider" value="deepinfra"> DeepInfra</label>
      <label><input type="radio" name="provider" value="deepseek"> DeepSeek</label>
      <label><input type="radio" name="provider" value="other"> <span data-t="other"></span></label>
    </div>
    <div id="other-fields" hidden>
      <label for="url" data-t="url"></label>
      <input id="url" type="url" placeholder="http://localhost:11434/v1">
    </div>
    <ol id="key-steps" class="steps" hidden></ol>
    <label for="key" data-t="key"></label>
    <input id="key" type="password" autocomplete="off">
    <small><span id="key-optional" hidden data-t="key_optional"></span><span id="key-keep" hidden data-t="key_keep"></span></small>

    <label for="model-select" id="model-label" data-t="model"></label>
    <select id="model-select" hidden></select>
    <input id="model" type="text" list="model-list" hidden>
    <datalist id="model-list"></datalist>
    <small id="model-hint"></small>

    <h2 id="audio-title"><label for="audio" data-t="audio"></label></h2>
    <small data-t="audio_hint"></small>
    <select id="audio">
      <option value="gemini">Google Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="none" data-t="audio_none"></option>
    </select>
    <small id="audio-same" hidden data-t="audio_same"></small>
    <div id="audio-key-fields" hidden>
      <label for="audio-key" data-t="audio_key"></label>
      <input id="audio-key" type="password" autocomplete="off">
      <small><a id="audio-where-key" target="_blank" rel="noopener noreferrer" data-t="where_key"></a> <span id="audio-key-keep" hidden data-t="key_keep"></span></small>
    </div>

    <button id="submit" type="submit" data-t="submit"></button>
    <button id="cancel" class="secondary" type="button" hidden data-t="cancel"></button>
    <p class="error" id="error" hidden></p>
  </form>
  <p class="status" id="status" hidden></p>
</main>

  },
};
// How a layperson gets a key from each provider: the account, the credit (or the
// free tier) and the key page.
const KEY_HELP = {
  together: { name: 'Together', site: 'https://api.together.ai', billing: 'https://api.together.ai/settings/billing', keys: 'https://api.together.ai/settings/api-keys' },
  openai: { name: 'OpenAI', site: 'https://platform.openai.com', billing: 'https://platform.openai.com/account/billing/overview', keys: 'https://platform.openai.com/api-keys' },
  gemini: { name: 'Google AI Studio', site: 'https://aistudio.google.com', free: true, keys: 'https://aistudio.google.com/apikey' },
  deepinfra: { name: 'DeepInfra', site: 'https://deepinfra.com', billing: 'https://deepinfra.com/dash/billing', keys: 'https://deepinfra.com/dash/api_keys' },
  deepseek: { name: 'DeepSeek', site: 'https://platform.deepseek.com', billing: 'https://platform.deepseek.com/top_up', keys: 'https://platform.deepseek.com/api_keys' },
};
const link = (href, text) => Object.assign(document.createElement('a'), { href, textContent: text, target: '_blank', rel: 'noopener noreferrer' });
function keySteps(p) {
  const h = KEY_HELP[p], steps = $('key-steps');
  steps.hidden = !h || keepsKey();
  if (!h) return steps.replaceChildren();
  const step = (text, href) => { const li = document.createElement('li'); li.append(text); if (href) li.append(' ', link(href, t('open'))); return li; };
  steps.replaceChildren(
    step(t('step_account').replace('{name}', h.name), h.site),
    h.free ? step(t('step_free')) : step(t('step_credit'), h.billing),
    step(t('step_key'), h.keys),
  );
}
const lang = (navigator.languages || [navigator.language || 'pt']).map((l) => l.slice(0, 2)).find((l) => TEXTS[l]) || 'pt';
const t = (k) => TEXTS[lang][k] || TEXTS.pt[k] || k;
document.documentElement.lang = { pt: 'pt-BR', en: 'en', es: 'es' }[lang];
// Changing the AI (button in Settings): the account already exists, only the AI part shows.
const changing = document.documentElement.dataset.mode === 'change';
if (changing) {
  for (const [sel, k] of [['h1', 'title_change'], ['p.sub', 'sub_change'], ['#ai-title', 'ai_change'], ['#audio-title label', 'audio_change'], ['#submit', 'save']]) document.querySelector(sel).dataset.t = k;
  document.getElementById('account').hidden = true;
  document.getElementById('cancel').hidden = false;
}
for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);

const $ = (id) => document.getElementById(id);
// The code leaves the address as soon as it is read: it stays out of the browser history.
const code = new URLSearchParams(location.hash.slice(1)).get('code') || '';
history.replaceState(null, '', '/');
if (!code) { $('no-code').hidden = false; $('form').hidden = true; }

const showError = (msg) => { $('error').textContent = msg; $('error').hidden = !msg; };
const status = (msg) => { $('status').textContent = msg; $('status').hidden = !msg; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });

const provider = () => document.querySelector('input[name=provider]:checked').value;
// The current AI when changing it. Its key stays on this computer and is reused
// when the field is left empty for the same provider (and address).
let currentAi = null;
const keepsKey = () => Boolean(currentAi?.hasKey && currentAi.provider === provider()
  && (provider() !== 'other' || currentAi.url === $('url').value.trim().replace(/\/+$/, '')));
function switchProvider() {
  const p = provider();
  if (!audioTouched) $('audio').value = AUDIO.includes(p) ? p : 'none';
  switchAudio();
  $('other-fields').hidden = p !== 'other';
  keySteps(p);
  $('key-optional').hidden = p !== 'other';
  $('key-keep').hidden = !keepsKey();
  $('model-select').hidden = p === 'other';
  $('model').hidden = p !== 'other';
  $('model-label').htmlFor = p === 'other' ? 'model' : 'model-select';
  loadModels();
}
// The models the key can use. Brambit asks the AI (this page cannot reach it)
// and the recommended one, or the current one when changing, comes selected.
// "other" keeps a free text field: the list only suggests.
let lookup = 0, lookupTimer = null;
const hint = (k) => { $('model-hint').textContent = k ? t(k) : ''; };
async function loadModels() {
  const n = ++lookup, p = provider(), key = $('key').value.trim(), other = p === 'other';
  $('model-select').replaceChildren();
  $('model-list').replaceChildren();
  if (!code) return;
  if (other ? !$('url').value.trim() : !key && !keepsKey()) return hint(other ? 'models_other' : 'models_need_key');
  hint('models_loading');
  let j = {}, ok = false;
  try { const r = await post('/models', { code, provider: p, key, url: $('url').value }); ok = r.ok; j = await r.json().catch(() => ({})); } catch {}
  if (n !== lookup) return;
  if (!ok) {
    hint(other ? 'models_other' : '');
    if (!other) showError(t(j.error) === j.error ? t('generic') : t(j.error));
    return;
  }
  showError('');
  const preferred = currentAi?.provider === p && j.models.includes(currentAi.model) ? currentAi.model : j.recommended;
  for (const id of j.models) {
    if (other) { $('model-list').append(new Option(id, id)); continue; }
    const o = new Option(id === j.recommended ? `${id} (${t('recommended')})` : id, id);
    o.selected = id === preferred;
    $('model-select').append(o);
  }
  hint(other ? 'models_other' : 'models_help');
}
// Voice messages: the text provider's key serves when it is the same provider;
// another one needs its own key. Until the person picks, it follows the text choice.
const AUDIO = ['gemini', 'openai'];
let audioTouched = false;
function switchAudio() {
  const a = $('audio').value;
  $('audio-same').hidden = a !== provider();
  $('audio-key-fields').hidden = a === 'none' || a === provider();
  if (KEY_HELP[a]) $('audio-where-key').href = KEY_HELP[a].keys;
  $('audio-key-keep').hidden = !(currentAi?.hasAudioKey && currentAi.audio === a);
}
$('audio').addEventListener('change', () => { audioTouched = true; switchAudio(); });
for (const r of document.querySelectorAll('input[name=provider]')) r.addEventListener('change', switchProvider);
for (const id of ['key', 'url']) $(id).addEventListener('input', () => { clearTimeout(lookupTimer); lookupTimer = setTimeout(switchProvider, 600); });
switchProvider();
// The current AI comes selected, with its model; the key can stay the saved one.
if (changing) fetch('/current').then((r) => (r.ok ? r.json() : null)).then((a) => {
  const r = a && document.querySelector(`input[name=provider][value="${a.provider}"]`);
  if (!r) return;
  currentAi = a;
  r.checked = true;
  if (a.audio) { $('audio').value = a.audio; audioTouched = true; }
  if (a.provider === 'other') { $('url').value = a.url || ''; $('model').value = a.model || ''; }
  switchProvider();
}).catch(() => {});
// This page goes away and the real server comes back on the same address.
async function waitForServer(msg) {
  $('form').hidden = true;
  status(msg);
  for (let i = 0; i < 180; i++) {
    await sleep(1000);
    try { if ((await fetch('/api/config', { cache: 'no-store' })).ok) return true; } catch {}
  }
  status(t('timed_out'));
  return false;
}

$('cancel').addEventListener('click', async () => {
  $('cancel').disabled = true;
  try { if (!(await post('/cancel', { code })).ok) throw 0; }
  catch { $('cancel').disabled = false; return showError(t('code')); }
  if (await waitForServer(t('restarting'))) location.replace('/');
});

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  showError('');
  const name = $('name').value.trim(), email = $('email').value.trim(), password = $('password').value;
  if (!changing) {
    if (!name) return showError(t('e_name'));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError(t('e_email'));
    if (password.length < 12) return showError(t('e_password'));
    if (password !== $('password2').value) return showError(t('e_password2'));
  }
  $('submit').disabled = true;
  status(t('testing'));
  try {
    const r = await post('/install', { code, name, email, provider: provider(), key: $('key').value, url: $('url').value, model: provider() === 'other' ? $('model').value : $('model-select').value, audio: $('audio').value, audioKey: $('audio-key').value });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { status(''); $('submit').disabled = false; return showError(t(j.error) === j.error ? t('generic') : t(j.error)); }
  } catch { status(''); $('submit').disabled = false; return showError(t('generic')); }

  // The setup is saved and Brambit is swapping this page for the real server.
  if (!(await waitForServer(t(changing ? 'restarting' : 'starting')))) return;
  // When changing the AI, the previous session is still valid.
  if (changing) return location.replace('/');
  status(t('signing_in'));
  let r = await post('/api/signup', { name, email, password });
  if (r.status === 409) r = await post('/api/login', { email, password });
  if (r.ok) return location.replace('/');
  const j = await r.json().catch(() => ({}));
  status(t('account') + (j.error || r.status));
});
</script>
</body>
</html>
